services:
  - type: web
    name: turmericare-backend
    runtime: python
    rootDir: turmeric_project/turmeric_project
    buildCommand: >
      pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt
    startCommand: gunicorn --workers=1 --threads=1 --timeout=300 --bind=0.0.0.0:$PORT app:app
    envVars:
      - key: KERAS_BACKEND
        value: torch
    autoDeploy: true
